name: Build Android Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-viewer/**"
      - ".github/workflows/android-viewer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: android-viewer
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Viewer-1.5.77-android-apk
          path: android-viewer/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
