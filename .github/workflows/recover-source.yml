name: Recover Jenyok Java Sources

on:
  push:
    branches:
      - recovery/decompile-run3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare workspace
        run: |
          mkdir -p work/input work/decompiled recovered/Host/src/main/java recovered/Viewer/src/main/java recovered/binaries
      - name: Download release archives
        run: |
          curl -fL --retry 3 -o work/input/Host.zip "https://github.com/hgamef72-jpg/Jenyok/releases/download/1.0.0/Roblox12311-1.5.77-portable.zip"
          curl -fL --retry 3 -o work/input/Viewer.zip "https://github.com/hgamef72-jpg/Jenyok/releases/download/1.0.0/Viewer-1.5.77-portable.zip"
          unzip -p work/input/Host.zip app/saturn-pc-remote.jar > recovered/binaries/Host-original.jar
          unzip -p work/input/Viewer.zip app/saturn-pc-remote.jar > recovered/binaries/Viewer-original.jar
          unzip -p work/input/Host.zip app/Roblox12311.cfg > recovered/Host/Roblox12311.cfg
          unzip -p work/input/Viewer.zip app/Viewer.cfg > recovered/Viewer/Viewer.cfg
      - name: Download Vineflower decompiler
        run: |
          curl -fL --retry 3 -o work/vineflower.jar "https://github.com/Vineflower/vineflower/releases/download/1.12.0/vineflower-1.12.0.jar"
      - name: Decompile shared application JAR
        run: |
          java -Xmx4g -jar work/vineflower.jar recovered/binaries/Host-original.jar work/decompiled
          mkdir -p recovered/Host/src/main/java/com/saturn/remote recovered/Viewer/src/main/java/com/saturn/remote
          cp -a work/decompiled/com/saturn/remote/. recovered/Host/src/main/java/com/saturn/remote/
          cp -a work/decompiled/com/saturn/remote/. recovered/Viewer/src/main/java/com/saturn/remote/
      - name: Preserve resources and metadata
        run: |
          for role in Host Viewer; do
            if [ "$role" = "Host" ]; then input=work/input/Host.zip; else input=work/input/Viewer.zip; fi
            unzip -p "$input" app/saturn-pc-remote.jar > "work/$role.jar"
            for f in saturn.ico saturn.png saturn.svg; do
              mkdir -p "recovered/$role/src/main/resources"
              unzip -p "work/$role.jar" "$f" > "recovered/$role/src/main/resources/$f" || true
            done
          done
          cat > recovered/README.md <<'EOF'
          # Jenyok 1.5.77 recovered source
          
          Host and Viewer contain the same application JAR; the launch configuration selects com.saturn.remote.HostApp or com.saturn.remote.ViewerApp.
          
          The original program was compiled from Kotlin. Vineflower reconstructs Java source from JVM bytecode, not the original Kotlin source. Comments, formatting, some names, and Kotlin-specific syntax cannot be recovered exactly. The source should be reviewed and compile-tested before modification.
          
          Original application JARs are preserved under binaries/.
          EOF
          printf '# Host\nEntry point: com.saturn.remote.HostApp\nVersion: 1.5.77\n' > recovered/Host/README.md
          printf '# Viewer\nEntry point: com.saturn.remote.ViewerApp\nVersion: 1.5.77\n' > recovered/Viewer/README.md
      - name: Package recovered source
        run: |
          cd recovered && zip -qr ../Jenyok-1.5.77-recovered-vineflower.zip . && cd ..
          find recovered -type f | sort > recovered-file-list.txt
          echo "Java files: $(find recovered/Host/src/main/java -type f -name '*.java' | wc -l)"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jenyok-1.5.77-recovered-vineflower
          path: |
            Jenyok-1.5.77-recovered-vineflower.zip
            recovered-file-list.txt
          retention-days: 30
