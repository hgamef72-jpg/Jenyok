name: Build and publish Jenyok 1.0.8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-viewer/**"
      - "tools/patch_host_stream.py"
      - ".github/workflows/publish-1.0.4.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.0.5 Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input dist
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Viewer-1.5.77.zip" --dir input
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Roblox12311-1.5.77.zip" --dir input

      - name: Optimize and verify Windows Host capture pacing
        run: |
          python tools/patch_host_stream.py input/Roblox12311-1.5.77.zip dist/Roblox12311-1.5.77.zip
          cp input/Viewer-1.5.77.zip dist/Viewer-1.5.77.zip
          unzip -t dist/Viewer-1.5.77.zip
          unzip -t dist/Roblox12311-1.5.77.zip

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android Viewer
        working-directory: android-viewer
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          cp android-viewer/app/build/outputs/apk/debug/app-debug.apk dist/Viewer-1.0.8.apk
          test -s dist/Viewer-1.0.8.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Viewer-1.0.8.apk
          unzip -t dist/Viewer-1.0.8.apk

      - name: Publish Jenyok 1.0.8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(cat <<'EOF'
          Jenyok 1.0.8

          Host streaming:
          - Reduces the Host capture-loop idle interval from 120 ms to 33 ms (approximately 30 FPS pacing before capture, JPEG encoding, and network overhead).
          - Keeps the original 1280-pixel maximum capture width and existing wire protocol.
          - Sends only the Host package with the verified HostApp bytecode change; Windows Viewer package is carried forward unchanged.

          Android Viewer:
          - Parses the documented 4-byte big-endian monitor index and renders only the selected display instead of mixing frames from every monitor.
          - Coalesces decoded frames so the UI thread never accumulates a queue of stale bitmap updates.
          - Recycles replaced pending frames and clears stale frames on display changes.
          - Throttles touch-move messages to approximately 60 updates/second and drops move packets if the outgoing WebSocket queue is congested.
          - Keeps control heartbeats alive while Block Input is still starting.
          - Reduces unnecessary heartbeat traffic while retaining 5-second status polling.
          - Preserves the existing neon cyan/purple UI.

          Validation:
          - Host patcher checks the exact HostApp.runHostSession Thread.sleep bytecode pattern before changing 120 ms to 33 ms.
          - Nested JAR and portable ZIP integrity checks are required.
          - Android APK build, signature verification, and ZIP integrity checks are required.
          - No physical Android/Windows runtime test is available in CI; actual FPS and input latency must still be confirmed on the user's devices.
          EOF
          )"
          if gh release view v1.0.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.8 dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.8 --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.8 — Performance" --notes "$NOTES" --latest
          else
            gh release create v1.0.8 dist/* --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.8 — Performance" --notes "$NOTES" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Jenyok-1.0.8-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
