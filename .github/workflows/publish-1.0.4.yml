name: Build and publish Jenyok 1.0.9

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-viewer/**"
      - "tools/patch_host_stream.py"
      - "tools/patch_windows_recovery.py"
      - ".github/workflows/publish-1.0.4.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download verified v1.0.5 Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input dist
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Viewer-1.5.77.zip" --dir input
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Roblox12311-1.5.77.zip" --dir input

      - name: Set 20 ms Host capture pacing
        run: |
          python tools/patch_host_stream.py input/Roblox12311-1.5.77.zip dist/Roblox12311-1.5.77-stream.zip

      - name: Repair Recovery handshake, Power shutdown and Viewer gate
        run: |
          python tools/patch_windows_recovery.py dist/Roblox12311-1.5.77-stream.zip dist/Roblox12311-1.5.77.zip
          python tools/patch_windows_recovery.py input/Viewer-1.5.77.zip dist/Viewer-1.5.77.zip
          rm dist/Roblox12311-1.5.77-stream.zip
          unzip -t dist/Roblox12311-1.5.77.zip
          unzip -t dist/Viewer-1.5.77.zip

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android Viewer
        working-directory: android-viewer
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          cp android-viewer/app/build/outputs/apk/debug/app-debug.apk dist/Viewer-1.0.9.apk
          test -s dist/Viewer-1.0.9.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Viewer-1.0.9.apk
          unzip -t dist/Viewer-1.0.9.apk

      - name: Publish Jenyok 1.0.9
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(cat <<'EOF'
          Jenyok 1.0.9

          Host streaming:
          - Changes the Host capture-loop idle interval from 120 ms to 20 ms (50 FPS pacing target before capture, JPEG encoding, relay and network overhead).
          - Preserves the existing frame format, 1280-pixel maximum capture width and wire protocol.

          Recovery and Power:
          - Corrects the Recovery Agent version handshake to 1.5.9 so the installer and supervisor agree.
          - Allows the Windows Viewer Recovery action while connected even if the readiness notification was delayed or lost; the Agent still must be running to accept the request.
          - Fixes Power shutdown semantics: normal Power now leaves the session-paused marker without writing the Recovery request marker, preventing the watchdog from interpreting shutdown as a restart request.
          - Keeps Recovery as a separate request that can restart the Host.

          Android Viewer:
          - Keeps the JPEG SOI frame parsing fix and latest-frame rendering pipeline.
          - Adds explicit timeout/denial feedback for Remote Control and Block Input instead of leaving the buttons in WAIT indefinitely.
          - Preserves touch move throttling and control heartbeats.

          Validation:
          - Bytecode patchers require exact audited v1.5.77 method patterns and fail closed if they differ.
          - Nested JAR and portable ZIP integrity checks are required.
          - Android APK build, signature verification and ZIP integrity checks are required.
          - CI cannot verify physical Windows hooks, real input injection, relay routing, Recovery restart or actual FPS. These require device testing.
          - 20 ms is a pacing target, not a guarantee of 50 delivered FPS.
          EOF
          )"
          if gh release view v1.0.9 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.9 dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.9 --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.9 — Stream, Control and Recovery" --notes "$NOTES" --latest
          else
            gh release create v1.0.9 dist/* --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.9 — Stream, Control and Recovery" --notes "$NOTES" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Jenyok-1.0.9-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
