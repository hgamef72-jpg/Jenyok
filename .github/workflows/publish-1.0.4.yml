name: Build and publish Jenyok 1.0.6

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-viewer/**"
      - ".github/workflows/publish-1.0.4.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download v1.0.5 Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input dist
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Viewer-1.5.77.zip" --dir input
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Roblox12311-1.5.77.zip" --dir input

      - name: Reuse verified Windows packages
        run: |
          cp input/Viewer-1.5.77.zip dist/Viewer-1.5.77.zip
          cp input/Roblox12311-1.5.77.zip dist/Roblox12311-1.5.77.zip
          unzip -t dist/Viewer-1.5.77.zip
          unzip -t dist/Roblox12311-1.5.77.zip

      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android Viewer
        working-directory: android-viewer
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          cp android-viewer/app/build/outputs/apk/debug/app-debug.apk dist/Viewer-1.0.6.apk
          test -s dist/Viewer-1.0.6.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Viewer-1.0.6.apk
          unzip -t dist/Viewer-1.0.6.apk

      - name: Publish Jenyok 1.0.6
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(cat <<'EOF'
          Jenyok 1.0.6

          Windows:
          - Windows Viewer and Host packages are carried forward unchanged from v1.0.5.
          - Recovery is not claimed as fixed in this release; the actual Host Agent recovery path still needs runtime diagnostics.

          Android Viewer:
          - Keeps the dark neon cyan/purple UI.
          - Decodes frames on a dedicated worker and drops stale queued frames to avoid a growing render backlog.
          - Starts the screen stream once after host selection instead of restarting it every 3 seconds.
          - Sends control lease heartbeats every 900 ms and polls host/display status every 5 seconds.
          - Improved host discovery and explicit host selection.
          - Requests screen size and START_STREAM after selecting a Host.
          - Polls Agent/Host status and display inventory while connected.
          - Scans frame packets for JPEG boundaries without guessing an undocumented 4-byte monitor prefix.
          - Keeps monitor selection and touch coordinate mapping.
          - Keeps Recovery, Remote Control, and Block Host Input controls.
          - Windows Recovery is unchanged in this release; the previous UI patch did not establish that the Host Agent recovery operation succeeds.

          Validation:
          - Windows nested JAR and portable ZIP integrity are checked.
          - Android APK build, ZIP integrity, and APK signature verification are required before publishing.
          - APK build, APK signature, and archive integrity are checked in CI. Physical-device FPS and end-to-end Recovery still require runtime verification.
          EOF
          )"
          if gh release view v1.0.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.6 dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit v1.0.6 --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.6" --notes "$NOTES" --latest
          else
            gh release create v1.0.6 dist/* --repo "$GITHUB_REPOSITORY" --title "Jenyok 1.0.6" --notes "$NOTES" --latest
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Jenyok-1.0.6-release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30
