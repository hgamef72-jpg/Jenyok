name: Build Jenyok 1.0.12 candidate

on:
  push:
    branches: ["rebuild/**"]
    paths:
      - "relay/**"
      - "tools/RelayEndpointPatcher.java"
      - "tools/JenyokStreamPatcher.java"
      - "tools/StreamPacer.java"
      - "tools/FrameRenderer.java"
      - "tools/patch_windows_recovery.py"
      - "android-viewer/**"
      - ".github/workflows/build-1.0.12-candidate.yml"
  pull_request:
    branches: [main]
    paths:
      - "relay/**"
      - "tools/RelayEndpointPatcher.java"
      - "tools/JenyokStreamPatcher.java"
      - "tools/StreamPacer.java"
      - "tools/FrameRenderer.java"
      - "tools/patch_windows_recovery.py"
      - "android-viewer/**"
      - ".github/workflows/build-1.0.12-candidate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download baseline Windows packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input dist tools/classes
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Viewer-1.5.77.zip" --dir input
          gh release download v1.0.5 --repo "$GITHUB_REPOSITORY" --pattern "Roblox12311-1.5.77.zip" --dir input

      - name: Prepare ASM and compile patchers
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm/9.7.1/asm-9.7.1.jar -o input/asm.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/ow2/asm/asm-tree/9.7.1/asm-tree-9.7.1.jar -o input/asm-tree.jar
          unzip -p input/Viewer-1.5.77.zip app/saturn-pc-remote.jar > input/viewer-app.jar
          javac --release 17 -cp "input/asm.jar:input/asm-tree.jar:input/viewer-app.jar" -d tools/classes \
            tools/JenyokStreamPatcher.java tools/StreamPacer.java tools/FrameRenderer.java tools/RelayEndpointPatcher.java

      - name: Patch Host stream, Recovery and relay endpoint
        run: |
          java -cp "tools/classes:input/asm.jar:input/asm-tree.jar" JenyokStreamPatcher \
            host input/Roblox12311-1.5.77.zip dist/host-stream.zip \
            tools/classes/com/saturn/remote/StreamPacer.class
          python tools/patch_windows_recovery.py dist/host-stream.zip dist/host-recovery.zip
          java -cp "tools/classes:input/asm.jar:input/asm-tree.jar" RelayEndpointPatcher \
            dist/host-recovery.zip dist/Roblox12311-1.5.77.zip \
            wss://jenyok-relay-rebuilt.onrender.com/connect

      - name: Patch Windows Viewer stream and relay endpoint
        run: |
          java -cp "tools/classes:input/asm.jar:input/asm-tree.jar" JenyokStreamPatcher \
            viewer input/Viewer-1.5.77.zip dist/viewer-stream.zip \
            tools/classes/com/saturn/remote/FrameRenderer.class
          java -cp "tools/classes:input/asm.jar:input/asm-tree.jar" RelayEndpointPatcher \
            dist/viewer-stream.zip dist/Viewer-1.5.77.zip \
            wss://jenyok-relay-rebuilt.onrender.com/connect
          unzip -t dist/Roblox12311-1.5.77.zip
          unzip -t dist/Viewer-1.5.77.zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK components
        run: sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android Viewer 1.0.12
        working-directory: android-viewer
        run: gradle --no-daemon clean assembleDebug

      - name: Verify Android APK
        run: |
          cp android-viewer/app/build/outputs/apk/debug/app-debug.apk dist/Viewer-1.0.12.apk
          test -s dist/Viewer-1.0.12.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Viewer-1.0.12.apk
          unzip -t dist/Viewer-1.0.12.apk

      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: Jenyok-1.0.12-candidate
          path: |
            dist/Roblox12311-1.5.77.zip
            dist/Viewer-1.5.77.zip
            dist/Viewer-1.0.12.apk
          if-no-files-found: error
          retention-days: 30
