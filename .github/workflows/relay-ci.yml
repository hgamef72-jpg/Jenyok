name: Relay CI

on:
  push:
    branches: [main, "rebuild/**"]
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package.json
      - run: npm install
      - run: npm test
