name: Relay CI

on:
  push:
    branches: [main, "rebuild/**"]
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"
  pull_request:
    paths:
      - "relay/**"
      - ".github/workflows/relay-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package.json
      - run: npm install
      - run: npm test
      - name: Smoke test deployed Relay host selection and Recovery routing
        env:
          JENYOK_RELAY_URL: wss://jenyok-relay-rebuilt.onrender.com/connect
        run: |
          for attempt in $(seq 1 24); do
            if curl -fsS https://jenyok-relay-rebuilt.onrender.com/healthz | grep -q '"ok":true'; then
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "Deployed Relay health check failed"
              exit 1
            fi
            sleep 5
          done
          node test/deployed-smoke.js
