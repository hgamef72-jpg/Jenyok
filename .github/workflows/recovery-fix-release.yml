name: Publish Recovery Agent Fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/recovery-fix-release.yml"
      - "patches/recovery-agent-version.patch"

permissions:
  contents: write

jobs:
  patch-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Download original 1.0.0 portable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p input output
          gh release download 1.0.0 --repo "$GITHUB_REPOSITORY" --pattern "Viewer-1.5.77-portable.zip" --dir input
          gh release download 1.0.0 --repo "$GITHUB_REPOSITORY" --pattern "Roblox12311-1.5.77-portable.zip" --dir input

      - name: Correct Recovery Agent version handshake
        run: |
          python - <<'PY'
          import io
          import pathlib
          import zipfile

          root = pathlib.Path("input")
          out = pathlib.Path("output")
          out.mkdir(exist_ok=True)

          targets = [
              "Viewer-1.5.77-portable.zip",
              "Roblox12311-1.5.77-portable.zip",
          ]

          for filename in targets:
              source = root / filename
              destination = out / filename.replace(".zip", "-recovery-fix.zip")

              with zipfile.ZipFile(source, "r") as outer_in, zipfile.ZipFile(
                  destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6
              ) as outer_out:
                  for item in outer_in.infolist():
                      payload = outer_in.read(item.filename)

                      if item.filename == "app/saturn-pc-remote.jar":
                          patched_jar = io.BytesIO()
                          with zipfile.ZipFile(io.BytesIO(payload), "r") as jar_in, zipfile.ZipFile(
                              patched_jar, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9
                          ) as jar_out:
                              for jar_item in jar_in.infolist():
                                  content = jar_in.read(jar_item.filename)
                                  if jar_item.filename == "com/saturn/remote/AppsKt.class":
                                      count = content.count(b"1.5.8")
                                      if count != 2:
                                          raise SystemExit(
                                              f"Unexpected Recovery Agent constants in {filename}: {count}"
                                          )
                                      content = content.replace(b"1.5.8", b"1.5.9")
                                      if b"1.5.8" in content:
                                          raise SystemExit("Old Recovery Agent version remains")
                                  jar_out.writestr(jar_item, content)

                          with zipfile.ZipFile(io.BytesIO(patched_jar.getvalue()), "r") as check:
                              if check.testzip() is not None:
                                  raise SystemExit("Patched application JAR failed integrity check")
                              klass = check.read("com/saturn/remote/AppsKt.class")
                              if klass.count(b"1.5.8") != 0 or klass.count(b"1.5.9") != 5:
                                  raise SystemExit("Recovery Agent version handshake verification failed")
                          payload = patched_jar.getvalue()

                      outer_out.writestr(item, payload)

              with zipfile.ZipFile(destination, "r") as check:
                  if check.testzip() is not None:
                      raise SystemExit(f"Portable archive integrity check failed: {destination}")

              print(f"Patched and verified: {destination}")
          PY

      - name: Publish Jenyok 1.0.1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.1 \
            output/Viewer-1.5.77-portable-recovery-fix.zip \
            output/Roblox12311-1.5.77-portable-recovery-fix.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Jenyok 1.0.1 - Recovery Fix" \
            --notes "Fixes the Recovery Agent version handshake. The supervisor and installer now agree on version 1.5.9, allowing the Viewer to receive HOST_AGENT_READY and enable the Recovery button when the agent is connected." \
            --latest
