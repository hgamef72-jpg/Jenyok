plugins { id 'com.android.application' }

android {
    namespace 'com.jenyok.viewer'
    compileSdk 35
    defaultConfig {
        applicationId 'com.jenyok.viewer'
        minSdk 26
        targetSdk 35
        versionCode 1577
        versionName '1.5.77'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
